name: Build Glasses Pay APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "samples/CameraAccess/**"
      - ".github/workflows/build-glasses-pay.yml"

jobs:
  build:
    runs-on: ubuntu-24.04  # has the Android SDK preinstalled
    defaults:
      run:
        working-directory: samples/CameraAccess
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GlassesPay-apk
          path: samples/CameraAccess/app/build/outputs/apk/debug/*.apk
